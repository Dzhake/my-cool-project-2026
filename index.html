<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Image measurement</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="mode-length">
    <div id="app">
        <div id="panel">
            <button id="selectImageButton">Select image</button>
            <input type="file" id="fileInput" accept="image/*" hidden>

            <div id="calcRow">
                <label for="calcMode">Calculate</label>
                <select id="calcMode">
                    <option value="length" selected>Length</option>
                    <option value="area">Area</option>
                </select>
            </div>

            <div class="tool" id="toolMeasurement">
                <div class="toolRow">
                    <button class="arrow" id="measurementArrow" type="button">▾</button>
                    <button class="toolBtn" id="measurementButton" type="button">Select measurement</button>
                </div>
                <div class="options" id="measurementOptions">
                    <label for="measurementSize">Size</label>
                    <input type="text" id="measurementSize" placeholder="2 cm" autocomplete="off">
                    <div class="hint">Pick 2 points on an object of known size.</div>
                </div>
            </div>

            <div class="tool" id="toolLine">
                <div class="toolRow">
                    <button class="arrow" id="lineArrow" type="button">▾</button>
                    <button class="toolBtn" id="lineButton" type="button">Select broken line</button>
                </div>
                <div class="options" id="lineOptions">
                    <div class="hint">Pick points along the line. Click near the last point to confirm.</div>
                </div>
            </div>

            <div class="tool" id="toolWand">
                <div class="toolRow">
                    <button class="arrow" id="wandArrow" type="button">▾</button>
                    <button class="toolBtn" id="wandButton" type="button">Magic wand</button>
                </div>
                <div class="options" id="wandOptions">
                    <label for="threshold">Threshold <span id="thresholdValue">32</span></label>
                    <input type="range" id="threshold" min="0" max="255" value="32">
                    <label class="check"><input type="checkbox" id="adjacent" checked> Only adjacent</label>
                    <div class="hint">Modifiers: none — replace, Ctrl — subtract, Shift — add, Ctrl+Shift — intersect.
                    </div>
                </div>
            </div>

            <div id="selectionInfo"></div>
            <output id="result"></output>
            <div id="status"></div>

            <div class="tool" id="toolSettings">
                <div class="toolRow">
                    <button class="arrow" id="settingsArrow" type="button">▾</button>
                    <button class="toolBtn" id="settingsButton" type="button">Settings</button>
                </div>
                <div class="options" id="settingsOptions">
                    <label class="check"><input type="checkbox" id="smoothSelection" checked> Smooth selection</label>
                    <div class="hint">Rounds the outline for display. The area value is always exact.</div>
                </div>
            </div>
            <button id="resetViewButton">Reset view</button>
        </div>
        <div id="viewer">
            <canvas id="canvas"></canvas>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
