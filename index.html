
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Measuring Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="panel">
      <h1>Image measuring</h1>

      <button id="selectImageButton" type="button">Select image</button>
      <input type="file" id="fileInput" accept="image/*" hidden>

      <button id="measurementButton" type="button" disabled>Select measurement</button>

      <div class="field">
        <label for="measurementSize">Measurement size</label>
        <input type="text" id="measurementSize" placeholder="e.g. 2cm, 12.5 mm, 0.7 in"
               autocomplete="off" spellcheck="false">
      </div>

      <button id="distanceButton" type="button" disabled>Select distance</button>

      <div class="field">
        <div class="label">Distance</div>
        <output id="result">&mdash;</output>
      </div>

      <p id="status">Select an image to begin.</p>
    </aside>

    <main id="viewer">
      <canvas id="canvas"></canvas>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
