<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Measuring Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <aside id="panel">
            <h1>Image measuring</h1>

            <button id="selectImageButton" type="button">Select image</button>
            <input type="file" id="fileInput" accept="image/*" hidden>

            <button id="measurementButton" type="button" disabled>Select measurement</button>

            <div class="field">
                <label for="measurementSize">Measurement size</label>
                <input type="text" id="measurementSize" placeholder="e.g. 2cm, 12.5 mm, 0.7 in" autocomplete="off"
                    spellcheck="false">
            </div>

            <div class="field">
                <label for="calculateMode">Calculate</label>
                <select id="calculateMode">
                    <option value="length" selected>Length</option>
                    <option value="area">Area</option>
                </select>
            </div>

            <div id="lengthTools">
                <button id="lineButton" type="button" disabled>Select broken line</button>
                <div class="field">
                    <div class="label">Distance</div>
                    <output id="result">&mdash;</output>
                </div>
            </div>

            <div id="areaTools" hidden>
                <button id="wandButton" type="button" disabled>Magic wand</button>
                <div class="field">
                    <label for="thresholdSlider">Threshold: <span id="thresholdValue">32</span></label>
                    <input type="range" id="thresholdSlider" min="0" max="255" value="32">
                </div>
                <label class="check"><input type="checkbox" id="adjacentToggle" checked> only adjacent</label>
                <div class="field">
                    <div class="label">Selected area</div>
                    <output id="areaResult">&mdash;</output>
                </div>
            </div>

            <p id="status">Select an image to begin.</p>

            <button id="resetViewButton" type="button" disabled>Reset view</button>
        </aside>

        <main id="viewer">
            <canvas id="canvas"></canvas>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
